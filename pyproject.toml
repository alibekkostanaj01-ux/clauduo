[project]
name = "g2c"
version = "0.1.0"
description = "Конвейер «Глава → курс»: глава книги → учебный слой → форматы → демо-курс"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "networkx>=3.3",
    "streamlit>=1.40",
    "gitpython>=3.1",
    "httpx>=0.27",
    "latex2mathml>=3.77",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "lasio>=0.31",
    "edge-tts>=6.1",
    "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
g2c = "g2c.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["g2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=work/.pytest_tmp -p no:cacheprovider"
